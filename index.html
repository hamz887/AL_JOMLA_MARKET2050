@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ===== الألوان ===== */
:root{--p:#4f46e5;--p2:#7c3aed;--t:#0d9488;--g:#f59e0b;--r:#e11d48;--bg:#eef1f8;--sf:#fff;--sf2:#f5f7fc;--sf3:#eceff8;--bd:#e3e7f1;--tx:#0f172a;--tx2:#334155;--mu:#64748b;--glass:rgba(255,255,255,.78);--sh:0 1px 2px rgba(15,23,42,.04),0 10px 28px -10px rgba(15,23,42,.14);--sh2:0 30px 70px -20px rgba(30,27,75,.45);--ring:rgba(79,70,229,.18);--hv:rgba(79,70,229,.055);color-scheme:light}
html[data-theme=dark]{--bg:#090e1c;--sf:#111a2e;--sf2:#0d1527;--sf3:#17223b;--bd:#223050;--tx:#e8ecf6;--tx2:#c6d0e1;--mu:#8d9cba;--glass:rgba(17,26,46,.78);--sh:0 1px 2px rgba(0,0,0,.3),0 14px 34px -12px rgba(0,0,0,.6);--sh2:0 30px 80px -20px rgba(0,0,0,.85);--ring:rgba(129,140,248,.28);--hv:rgba(129,140,248,.08);color-scheme:dark}

/* ===== أساسيات ===== */
html{font-size:clamp(13px,min(1.17vw,2.1vh),24px)}
*{box-sizing:border-box;margin:0}
body{font:500 .9375rem/1.6 Cairo,Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;transition:background-color .5s,color .5s;overflow-x:hidden}
::selection{background:var(--p);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mu) 38%,transparent);border-radius:11px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:var(--p)}::-webkit-scrollbar-track{background:transparent}
.i{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.2em}
small{font-size:.78em}
.mu{color:var(--mu)}
#app{display:none;min-height:100vh;position:relative}
#gdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ===== خلفية متحركة ===== */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fx i{position:absolute;border-radius:50%;animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.fx i:nth-child(1){width:40rem;height:40rem;background:radial-gradient(circle,rgba(99,102,241,.30),transparent 65%);top:-14rem;left:-10rem}
.fx i:nth-child(2){width:36rem;height:36rem;background:radial-gradient(circle,rgba(13,148,136,.26),transparent 65%);bottom:-14rem;left:28%;animation-delay:-8s;animation-duration:28s}
.fx i:nth-child(3){width:28rem;height:28rem;background:radial-gradient(circle,rgba(245,158,11,.20),transparent 65%);top:28%;right:16rem;animation-delay:-15s;animation-duration:32s}
.fx::after{content:'';position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--mu) 30%,transparent) 1px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,transparent 10%,#000 90%);mask-image:linear-gradient(180deg,transparent 10%,#000 90%);opacity:.45}
.fx .wv{position:absolute;bottom:0;left:0;width:100%;height:7rem;opacity:.9}
.fx .wv use:nth-child(1){fill:rgba(99,102,241,.07)}.fx .wv use:nth-child(2){fill:rgba(13,148,136,.06)}.fx .wv use:nth-child(3){fill:rgba(124,58,237,.05)}.fx .wv use:nth-child(4){fill:rgba(99,102,241,.06)}

/* ===== الأمواج ===== */
.wv{display:block;pointer-events:none}
.wv use{animation:wmv 25s cubic-bezier(.55,.5,.45,.5) infinite}
.wv use:nth-child(1){animation-delay:-2s;animation-duration:7s;fill:rgba(255,255,255,.28)}
.wv use:nth-child(2){animation-delay:-3s;animation-duration:10s;fill:rgba(255,255,255,.18)}
.wv use:nth-child(3){animation-delay:-4s;animation-duration:13s;fill:rgba(255,255,255,.12)}
.wv use:nth-child(4){animation-delay:-5s;animation-duration:20s;fill:rgba(255,255,255,.22)}
.wv.s use:nth-child(4){fill:var(--sf)}

/* ===== الشريط الجانبي ===== */
aside{width:15.75rem;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:1.1rem .8rem .9rem;color:#fff;z-index:3;overflow:hidden auto;background:linear-gradient(165deg,#080c1d 0%,#1a1747 48%,#2e2a7a 100%);box-shadow:-12px 0 40px -12px rgba(15,23,42,.55)}
.as-fx{position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(124,58,237,.42) 30%,transparent 42% 58%,rgba(13,148,136,.40) 68%,transparent 80%);animation:spin 20s linear infinite;filter:blur(38px);pointer-events:none}
aside>*{position:relative;z-index:1}
aside .wv{position:absolute;bottom:0;left:0;width:100%;height:5rem;z-index:0;opacity:.7}
.lg{display:flex;align-items:center;gap:.75rem;padding:.3rem .35rem 1.05rem;margin-bottom:.85rem;border-bottom:1px solid rgba(255,255,255,.1)}
.lg-i{width:3.2rem;height:3.2rem;border-radius:1.05rem;display:grid;place-items:center;background:rgba(255,255,255,.95);position:relative;flex-shrink:0;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.lg-i::before{content:'';position:absolute;inset:-3px;border-radius:1.25rem;padding:2px;background:conic-gradient(from var(--a),#fbbf24,#a78bfa,#2dd4bf,#fbbf24);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite}
.lg img{width:2.35rem;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}.lg:hover img{transform:rotate(360deg) scale(1.08)}
.lg b{display:block;font-size:1.06rem;font-weight:800;line-height:1.3;background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg small{display:block;color:#a5b4fc;font-size:.74rem;font-weight:600;max-width:9.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;flex-direction:column;gap:.28rem}
nav a{position:relative;display:flex;align-items:center;gap:.72rem;padding:.72rem .85rem;border-radius:.95rem;color:#c7d2fe;cursor:pointer;font-weight:700;font-size:.9rem;transition:color .25s,background .3s,transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;animation:nin .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*.06s + .15s)}
nav a .i{width:1.3rem;height:1.3rem;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
nav a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-5px)}
nav a:hover .i{transform:scale(1.18) rotate(-8deg)}
nav a.on{color:#1e1b4b;background:linear-gradient(100deg,#fcd34d,#fb923c);box-shadow:0 10px 26px -8px rgba(251,146,60,.75),inset 0 1px 0 rgba(255,255,255,.55);transform:none}
nav a.on::after{content:'';position:absolute;left:.9rem;width:.45rem;height:.45rem;border-radius:50%;background:#1e1b4b;animation:pulse 2s infinite}
.as-ft{margin-top:auto;padding-top:.9rem;display:flex;flex-direction:column;gap:.6rem}
.dt{text-align:center;padding:.65rem .5rem;border-radius:1rem;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.dt b{display:block;font-size:1.4rem;font-weight:800;letter-spacing:.02em;line-height:1.25}
.dt span{display:block;color:#a5b4fc;font-size:.76rem;font-weight:600}
.as-bt{display:flex;gap:.45rem}
.as-bt button{flex:1;--bb:rgba(255,255,255,.08);--bs:transparent;color:#e0e7ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:.78rem;padding:.5rem .4rem}
.as-bt button:hover{--bb:rgba(255,255,255,.16)}
.cr{text-align:center;color:#a5b4fc;font-size:.72rem;line-height:1.7;opacity:.85}

/* ===== المحتوى ===== */
main{flex:1;min-width:0;padding:1.35rem 1.6rem 3rem;position:relative;z-index:1}
main.in>*{animation:up .6s cubic-bezier(.2,.9,.3,1) both}
main.in>:nth-child(2){animation-delay:.07s}main.in>:nth-child(3){animation-delay:.13s}main.in>:nth-child(4){animation-delay:.19s}main.in>:nth-child(n+5){animation-delay:.25s}
main.in .box tr{animation:rw .5s cubic-bezier(.2,.9,.3,1) both}
main.in .box tr:nth-child(2){animation-delay:.18s}main.in .box tr:nth-child(3){animation-delay:.22s}main.in .box tr:nth-child(4){animation-delay:.26s}main.in .box tr:nth-child(5){animation-delay:.3s}main.in .box tr:nth-child(6){animation-delay:.34s}main.in .box tr:nth-child(7){animation-delay:.38s}main.in .box tr:nth-child(8){animation-delay:.42s}main.in .box tr:nth-child(n+9){animation-delay:.46s}

/* رأس الصفحة */
.ph{position:relative;border-radius:1.6rem;overflow:hidden;color:#fff;margin-bottom:1.1rem;background:linear-gradient(120deg,var(--h1),var(--h2) 55%,var(--h3));background-size:220% 220%;animation:bgm 12s ease infinite;box-shadow:0 22px 44px -22px var(--h1)}
main.in>.ph{animation:up .6s cubic-bezier(.2,.9,.3,1) both,bgm 12s ease infinite}
.ph-in{position:relative;z-index:2;display:flex;align-items:center;gap:1rem;padding:1.35rem 1.6rem 3.5rem;flex-wrap:wrap}
.ph-ic{width:3.5rem;height:3.5rem;border-radius:1.15rem;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),0 12px 26px -10px rgba(0,0,0,.4);animation:bob 4s ease-in-out infinite}
.ph-ic .i{width:1.75rem;height:1.75rem}
.ph h2{font-size:1.65rem;font-weight:900;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.ph p{opacity:.88;font-size:.88rem;font-weight:600;margin-top:.1rem}
.ph-ac{margin-inline-start:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.ph-ac button,.ph-ac .b{--bb:rgba(255,255,255,.97);--bs:rgba(0,0,0,.35);color:var(--h1);font-weight:800;box-shadow:0 10px 24px -10px var(--bs)}
.ph-o{position:absolute;inset:0;z-index:1;pointer-events:none}
.ph-o::before{content:'';position:absolute;width:17rem;height:17rem;border-radius:50%;border:2px dashed rgba(255,255,255,.2);top:-9rem;left:-3rem;animation:spin 40s linear infinite}
.ph-o::after{content:'';position:absolute;width:11rem;height:11rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.32),transparent 70%);top:-3rem;left:32%;animation:drift 9s ease-in-out infinite alternate}
.ph .wv{position:absolute;bottom:-1px;left:0;width:100%;height:3.3rem;z-index:1}
.ph-att{--h1:#4338ca;--h2:#6d28d9;--h3:#2563eb}.ph-emp{--h1:#0f766e;--h2:#0891b2;--h3:#4f46e5}.ph-tx{--h1:#c2410c;--h2:#e11d48;--h3:#d97706}.ph-acc{--h1:#4338ca;--h2:#0d9488;--h3:#0891b2}.ph-rcl{--h1:#6d28d9;--h2:#c026d3;--h3:#4338ca}.ph-rep{--h1:#1d4ed8;--h2:#4338ca;--h3:#0d9488}.ph-set{--h1:#334155;--h2:#4338ca;--h3:#1e293b}

/* صناديق وجداول */
.box{position:relative;background:var(--glass);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--bd);border-radius:1.3rem;box-shadow:var(--sh);padding:1rem;overflow:auto;margin-bottom:1rem}
.box::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--p),transparent);opacity:.45}
.box h3{display:flex;align-items:center;gap:.5rem;font-size:1.02rem;font-weight:800;margin-bottom:.8rem}
.box h3 .i{color:var(--p);width:1.35rem;height:1.35rem;padding:.25rem;box-sizing:content-box;border-radius:.6rem;background:color-mix(in srgb,var(--p) 12%,transparent)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{background:var(--sf2);color:var(--mu);font-size:.78rem;font-weight:800;padding:.75rem .6rem;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd);line-height:1.5}
th:first-child{border-radius:0 .85rem .85rem 0}th:last-child{border-radius:.85rem 0 0 .85rem}
td{padding:.68rem .6rem;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap;color:var(--tx2);transition:background .2s}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--hv)}
td b{color:var(--tx);font-weight:800}
td.nt{white-space:normal;max-width:14rem;color:var(--mu);font-size:.85rem}
.neg{color:var(--r)!important}
.who{display:flex;align-items:center;gap:.65rem;text-align:right}
.who b{display:block;line-height:1.35}.who small{display:block;color:var(--mu);font-weight:700}
.av{width:2.2rem;height:2.2rem;border-radius:.8rem;display:inline-grid;place-items:center;font-weight:900;color:#fff;font-size:.95rem;background:linear-gradient(135deg,hsl(var(--h) 78% 58%),hsl(calc(var(--h) + 45) 72% 45%));box-shadow:0 8px 16px -8px hsl(var(--h) 70% 40%);flex-shrink:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
tr:hover .av{transform:rotate(-8deg) scale(1.1)}
.cnt{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .45rem;border-radius:.7rem;font-weight:800;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.cnt.g{background:color-mix(in srgb,#10b981 15%,transparent);color:#059669}.cnt.r{background:color-mix(in srgb,#f43f5e 13%,transparent);color:#e11d48}
.acts{display:flex;gap:.35rem;justify-content:center;flex-wrap:nowrap}
.io{padding:.38rem .5rem}.io .i{width:1.05rem;height:1.05rem}
.cmp th,.cmp td{padding-left:.32rem;padding-right:.32rem}.cmp .av{width:1.9rem;height:1.9rem;font-size:.85rem}.cmp .who{gap:.5rem}
html[data-theme=dark] .ph .wv use{opacity:.55}
.tot{display:flex;align-items:center;justify-content:flex-end;gap:.8rem;margin-top:.8rem;padding:.75rem 1rem;border-radius:1rem;background:linear-gradient(100deg,color-mix(in srgb,var(--p) 10%,transparent),color-mix(in srgb,var(--t) 10%,transparent));font-weight:700;color:var(--mu)}
.tot b{font-size:1.2rem;color:var(--tx)}.tot span+span{margin-inline-start:auto}
.es{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:2.2rem 1rem;color:var(--mu);white-space:normal}
.es .i{width:3rem;height:3rem;padding:.7rem;box-sizing:content-box;border-radius:1.2rem;color:var(--p);background:color-mix(in srgb,var(--p) 10%,transparent);margin-bottom:.4rem;animation:bob 3s ease-in-out infinite}
.es b{color:var(--tx);font-size:1rem}
.hint{display:flex;align-items:flex-start;gap:.45rem;color:var(--mu);font-size:.84rem;font-weight:600;margin:.2rem .3rem .8rem}
.hint .i{color:var(--p);margin-top:.2rem}

/* أزرار */
button,.b{--bb:linear-gradient(135deg,var(--p),var(--p2));--bs:rgba(79,70,229,.45);position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:.82rem;padding:.6rem 1.05rem;background:var(--bb);color:#fff;cursor:pointer;font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;box-shadow:0 8px 18px -8px var(--bs);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,filter .2s,color .2s;white-space:nowrap;line-height:1.5;-webkit-tap-highlight-color:transparent}
button:hover,.b:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px var(--bs);filter:brightness(1.07)}
button:active,.b:active{transform:translateY(0) scale(.95)}
button::after,.b::after{content:'';position:absolute;top:0;left:-140%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s;z-index:-1;pointer-events:none}
button:hover::after,.b:hover::after{left:160%}
button:focus-visible,.b:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.b2{--bb:linear-gradient(135deg,#0d9488,#06b6d4);--bs:rgba(13,148,136,.5)}
.b3{--bb:linear-gradient(135deg,#e11d48,#f43f5e);--bs:rgba(225,29,72,.5)}
.b4{--bb:linear-gradient(135deg,#f59e0b,#fb923c);--bs:rgba(245,158,11,.55);color:#1e1b4b}
.b5{--bb:var(--sf);--bs:rgba(15,23,42,.14);color:var(--tx2);box-shadow:inset 0 0 0 1.5px var(--bd),0 4px 10px -6px var(--bs)}
.b5:hover{color:var(--p);box-shadow:inset 0 0 0 1.5px var(--p),0 12px 22px -12px rgba(79,70,229,.45)}
.b5::after{background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--p) 14%,transparent),transparent)}
.sm{padding:.38rem .72rem;font-size:.8rem;border-radius:.68rem;gap:.35rem}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none;z-index:-1}
.b5 .rp,.seg button:not(.on) .rp,.ch.c-n .rp{background:color-mix(in srgb,var(--p) 20%,transparent)}

/* حقول */
input,select,textarea{width:100%;padding:.62rem .85rem;border:1.5px solid var(--bd);border-radius:.85rem;font:inherit;font-weight:600;margin-top:.3rem;background:var(--sf);color:var(--tx);transition:border-color .2s,box-shadow .25s,background .2s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--p) 45%,var(--bd))}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px var(--ring)}
textarea{min-height:4.6rem;resize:vertical}
label{display:block;margin-bottom:.85rem;font-size:.82rem;font-weight:700;color:var(--mu)}
.bar{display:flex;gap:.6rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.bar input{width:auto}
.bar label{margin:0;display:flex;align-items:center;gap:.4rem}.bar label input{margin:0}
.srch{position:relative;flex:1;min-width:13rem;max-width:25rem}
.srch .i{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.srch input{width:100%;margin:0;padding-right:2.5rem;background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--sh)}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem;align-items:end}
.qb{margin-bottom:.85rem}

/* شارات */
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .7rem;border-radius:99px;font-size:.74rem;font-weight:800;white-space:nowrap;vertical-align:middle}
.pill::before{content:'';width:.42rem;height:.42rem;border-radius:50%;background:currentColor}
.s-p{background:#d1fae5;color:#047857}.s-a{background:#ffe4e6;color:#be123c}.s-l{background:#fef3c7;color:#b45309}.s-n{background:var(--sf3);color:var(--mu)}.s-i{background:#e0e7ff;color:#4338ca}
html[data-theme=dark] .s-p{background:rgba(16,185,129,.16);color:#6ee7b7}html[data-theme=dark] .s-a{background:rgba(244,63,94,.16);color:#fda4af}html[data-theme=dark] .s-l{background:rgba(245,158,11,.16);color:#fcd34d}html[data-theme=dark] .s-i{background:rgba(99,102,241,.2);color:#c7d2fe}

/* شريط الأسبوع والتبويبات */
.wk,.seg{display:inline-flex;align-items:center;gap:.3rem;padding:.32rem;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:1.05rem;box-shadow:var(--sh)}
.wk input{width:auto;margin:0;padding:.32rem .6rem;border-radius:.7rem}
.wr{display:flex;align-items:center;gap:.45rem;padding:0 .7rem;font-weight:800;color:var(--tx)}
.wr .i{color:var(--p)}.wr span{color:var(--mu)}
.seg button{--bb:transparent;--bs:transparent;color:var(--mu);box-shadow:none;padding:.45rem .85rem}
.seg button:hover{color:var(--p);box-shadow:none;transform:none}
.seg button.on{--bb:linear-gradient(135deg,var(--p),var(--p2));--bs:rgba(79,70,229,.5);color:#fff;box-shadow:0 8px 18px -8px var(--bs)}

/* الدوام */
.ch{min-width:4.7rem;padding:.42rem .6rem;font-size:.8rem;border-radius:.78rem}
.ch.c-p{--bb:linear-gradient(135deg,#10b981,#059669);--bs:rgba(16,185,129,.55)}
.ch.c-a{--bb:linear-gradient(135deg,#fb7185,#e11d48);--bs:rgba(244,63,94,.55)}
.ch.c-l{--bb:linear-gradient(135deg,#fcd34d,#f59e0b);--bs:rgba(245,158,11,.55);color:#451a03}
.ch.c-n{--bb:transparent;--bs:transparent;color:var(--mu);box-shadow:inset 0 0 0 1.5px var(--bd);font-weight:600}
.ch.c-n:hover{color:var(--p);box-shadow:inset 0 0 0 1.5px var(--p)}
.ch.pp{animation:pp .55s cubic-bezier(.3,1.8,.5,1)}
th.tdy{color:var(--p);background:color-mix(in srgb,var(--p) 11%,var(--sf2))}
td.tdy{background:color-mix(in srgb,var(--p) 5%,transparent)}
th small{font-weight:600}
.allp{display:inline-block;margin-top:.3rem;font-size:.68rem;font-weight:800;color:var(--p);cursor:pointer;padding:.08rem .55rem;border-radius:99px;background:color-mix(in srgb,var(--p) 11%,transparent);transition:.2s}
.allp:hover{background:var(--p);color:#fff;transform:scale(1.06)}

/* تنبيه */
.warn{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-radius:1.1rem;margin-bottom:1rem;color:#92400e;font-weight:700;background:linear-gradient(100deg,#fef3c7,#ffedd5);border:1px solid #fde68a;box-shadow:0 10px 24px -14px rgba(245,158,11,.6)}
.warn .i{width:1.5rem;height:1.5rem;color:#d97706;animation:pulse 2s infinite;border-radius:50%}
.warn span{flex:1}
.warn.sm{font-size:.84rem;padding:.65rem .85rem}
html[data-theme=dark] .warn{background:linear-gradient(100deg,rgba(245,158,11,.14),rgba(251,146,60,.1));border-color:rgba(245,158,11,.3);color:#fcd34d}

/* النوافذ */
.mb{position:fixed;inset:0;background:rgba(8,12,28,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:.8rem;z-index:30;animation:fd .3s both}
.mc{background:var(--sf);color:var(--tx);border-radius:1.5rem;width:min(38rem,100%);max-height:94vh;overflow:auto;box-shadow:var(--sh2),0 0 0 1px var(--bd);animation:pop .5s cubic-bezier(.2,1.25,.3,1) both}
.mh{position:sticky;top:0;z-index:3;overflow:hidden;color:#fff;padding:1.05rem 1.35rem 1.95rem;background:linear-gradient(120deg,#4338ca,#7c3aed 55%,#0d9488);background-size:220% 220%;animation:bgm 10s ease infinite}
.mh h3{font-size:1.15rem;font-weight:900;position:relative;z-index:2;display:flex;align-items:center;gap:.5rem}
.mh .x{position:absolute;left:.85rem;top:.8rem;z-index:3;width:2.15rem;height:2.15rem;padding:0;border-radius:.75rem;--bb:rgba(255,255,255,.18);--bs:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.mh .x:hover{transform:rotate(90deg)}
.mh .wv{position:absolute;bottom:-1px;left:0;width:100%;height:1.7rem;z-index:1}
.mbd{padding:1.05rem 1.35rem .4rem}
.ft{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.mc>.ft{position:sticky;bottom:0;z-index:3;margin:0;padding:.85rem 1.35rem 1.15rem;background:var(--sf);border-top:1px solid var(--bd)}
.rinf{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1rem;border-radius:1.05rem;margin-bottom:1rem;background:var(--sf2);border:1px solid var(--bd)}
.rk{text-align:left}.rk span{display:block;font-size:.75rem;color:var(--mu);font-weight:700}.rk b{font-size:1.3rem;font-weight:900;color:var(--p)}
.pdx{margin-top:1rem;padding:1rem 1rem .4rem;border-radius:1.1rem;background:var(--sf2);border:1px solid var(--bd)}
.pdx label{margin-bottom:.6rem}.pdx .ft{margin:0 0 .6rem}
/* نافذة الوصل العريضة: كل شيء ظاهر بدون سحب */
.mc.wide{width:min(66rem,100%);height:min(94vh,52rem);display:flex;flex-direction:column;overflow:hidden}
.wide .mbd{flex:1;min-height:0;display:flex;padding:1rem 1.2rem 1.15rem}
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(19rem,25rem) 1fr;grid-template-rows:minmax(0,1fr);gap:1.1rem}
.rpan{display:flex;flex-direction:column;gap:.62rem;overflow:auto;padding:.15rem .2rem .2rem}
.rcol{overflow:auto;border-radius:1.2rem;padding:1rem .8rem;background:radial-gradient(circle at 30% 0,color-mix(in srgb,var(--p) 10%,transparent),transparent 60%),var(--sf2);box-shadow:inset 0 0 0 1px var(--bd)}
.rcol .rcw{margin:0}
.rsum{position:relative;overflow:hidden;color:#fff;padding:.85rem 1rem;border-radius:1.15rem;background:linear-gradient(120deg,#4338ca,#7c3aed 60%,#0d9488);background-size:200% 200%;animation:bgm 9s ease infinite;box-shadow:0 14px 28px -16px #4338ca}
.rsum>span{font-size:.78rem;font-weight:700;opacity:.85}.rsum>b{display:block;font-size:1.85rem;font-weight:900;line-height:1.25}
.rmini{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.72rem;font-weight:600;opacity:.92;margin-top:.15rem}.rmini b{font-weight:900}.rsum .neg{color:#fecdd3!important}
.plb{font-size:.8rem;font-weight:800;color:var(--mu);margin-top:.1rem}
.pops{display:flex;flex-direction:column;gap:.45rem}
.po{--bb:var(--sf);--bs:transparent;color:var(--tx);justify-content:flex-start;text-align:right;gap:.65rem;padding:.55rem .75rem;border-radius:.95rem;box-shadow:inset 0 0 0 1.5px var(--bd);white-space:normal}
.po:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1.5px var(--p),0 10px 20px -14px var(--p)}
.po .pr{width:1.45rem;height:1.45rem;border-radius:50%;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 2px var(--bd);color:transparent;transition:.25s}
.po .pr .i{width:.9rem;height:.9rem}
.po .pt2{flex:1;line-height:1.35}.po .pt2 b{display:block;font-size:.88rem}.po .pt2 small{color:var(--mu);font-weight:600;font-size:.72rem}
.po em{font-style:normal;font-weight:900;font-size:.98rem;color:var(--p)}.po>.i{color:var(--mu)}
.po.on{--bb:color-mix(in srgb,var(--t) 10%,var(--sf));box-shadow:inset 0 0 0 2px var(--t),0 12px 24px -16px var(--t)}
.po.on .pr{background:linear-gradient(135deg,#10b981,#0d9488);box-shadow:none;color:#fff;animation:pp .45s cubic-bezier(.3,1.8,.5,1)}
.po.on em{color:var(--t)}
.po .rp{background:color-mix(in srgb,var(--t) 22%,transparent)}
.pin{margin:0}.pin input{font-size:1.25rem;font-weight:900;text-align:center;height:3rem;letter-spacing:.03em}
.rres{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .85rem;border-radius:.9rem;background:var(--sf2);box-shadow:inset 0 0 0 1px var(--bd);font-size:.8rem;font-weight:700;color:var(--mu);transition:.3s}
.rres b{font-size:1.1rem;font-weight:900;color:var(--tx)}
.rres.pos{background:color-mix(in srgb,var(--t) 10%,var(--sf));color:var(--t)}.rres.pos b{color:var(--t)}
.rres.neg{background:color-mix(in srgb,var(--r) 9%,var(--sf));color:var(--r)}.rres.neg b{color:var(--r)}
.big{width:100%;padding:.75rem 1rem;font-size:1rem;font-weight:900}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}.pg2 button{padding:.55rem .5rem;font-size:.84rem}
.rpan>*{flex-shrink:0}
@media(max-height:800px){.rpan{gap:.45rem}.rsum{padding:.6rem .9rem}.rsum>b{font-size:1.55rem}.po{padding:.42rem .7rem}.pin input{height:2.6rem;font-size:1.1rem}.big{padding:.6rem 1rem}.rres{padding:.42rem .8rem}.pg2 button{padding:.45rem .5rem}.wide .mbd{padding:.8rem 1.1rem .9rem}}
@media(max-width:820px){.mc.wide{height:auto;max-height:94vh;overflow:auto;display:block}.wide .mbd{display:block}.rgrid{display:flex;flex-direction:column}.rpan,.rcol{overflow:visible}}
/* تأكيد */
.cf{z-index:50}.cf .mc{width:min(25rem,100%);text-align:center;padding:1.7rem 1.4rem 1.3rem}
.cf p{font-weight:700;line-height:1.8;color:var(--tx)}.cf p small{display:block;color:var(--mu);font-weight:600;margin-top:.3rem;font-size:.84rem}
.cf .ft{justify-content:center;margin-top:1.2rem}
.cfi{width:3.8rem;height:3.8rem;border-radius:50%;margin:0 auto 1rem;display:grid;place-items:center;background:#ffe4e6;color:#e11d48;animation:pop .5s .1s both,ring 1.8s .6s infinite}
.cfi .i{width:1.8rem;height:1.8rem}
.cfi.ok{background:#d1fae5;color:#059669;animation:pop .5s .1s both,ringg 1.8s .6s infinite}

/* الوصل على الشاشة */
.rcw{filter:drop-shadow(0 14px 22px rgba(15,23,42,.22)) drop-shadow(0 0 1px rgba(15,23,42,.25));margin:.3rem 0 .6rem}
.rcp{background:#fff;color:#111;padding:1.3rem 1.15rem 1.5rem;margin:0 auto;width:min(100%,24rem);font-size:.82rem;line-height:1.75;font-weight:600;-webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/14px 51% repeat-x,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 51% repeat-x;mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/14px 51% repeat-x,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 51% repeat-x;animation:prt 1s cubic-bezier(.2,.8,.2,1) .15s both}
.rcp .rh{text-align:center}.rcp .rh img{display:block;margin:0 auto .15rem}
.rcp h4{font-size:1.08rem;font-weight:900;line-height:1.45}
.rcp table{width:100%;border-collapse:collapse;font-size:.96em}
.rcp td{padding:1px .2rem;text-align:right;white-space:normal;word-break:break-word;border:0;color:#111;background:none!important;line-height:1.6}
.rcp td+td{text-align:left;white-space:nowrap;width:1%;font-weight:800;padding-right:.5rem}
.rcp .tt td{font-weight:900;background:#eef2ff!important}
.rcp hr{margin:.4rem 0;border:0;border-top:1.5px dashed #555}
.rcp p{margin-top:.25rem}
.rcp .sg{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.rcp .rn{margin-top:.4rem;padding:.2rem .3rem;border:1px dashed #555;word-break:break-word}
.tbx{border:2px solid #000;padding:.35rem;text-align:center;margin:.35rem 0}
.tsc{display:flex;justify-content:space-between;font-weight:900}

/* إشعار */
.toast{position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.7rem;background:#1e1b4b;color:#fff;padding:.8rem 1.3rem .85rem 1.1rem;border-radius:1.1rem;z-index:99;box-shadow:0 20px 44px -12px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1);animation:tp .5s cubic-bezier(.2,1.3,.3,1) both;font-weight:700;overflow:hidden;max-width:min(92vw,34rem)}
.toast .ti{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:#f59e0b;color:#1e1b4b;flex-shrink:0;animation:pop .5s .15s both}
.toast.ok .ti{background:#10b981;color:#fff}
.toast::after{content:'';position:absolute;bottom:0;right:0;height:3px;width:100%;background:linear-gradient(90deg,#f59e0b,#fb923c);transform-origin:right;animation:tbar 3s linear both}

function testPr(){const r=RP();modal(ic('ruler')+' طباعة تجريبية',`<div class="rcw"><div class="rcp"><div class="rh"><img src="${LOGO}" width="40" alt=""><h4>${h(cf('shop')||'المحل')}</h4><div>طباعة تجريبية لضبط الطابعة</div></div><hr><div class="tbx"><div class="tsc"><span>▶ يمين</span><span>يسار ◀</span></div><div>يجب أن يظهر هذا الإطار الأسود كاملاً من الجهتين</div></div><table><tr><td>الأجر اليومي</td><td>25,000</td></tr><tr class="tt"><td>صافي الراتب النهائي</td><td>1,250,000</td></tr><tr><td>سطر طويل لاختبار التفاف النص داخل الوصل دون أن يُقص من الأطراف</td><td>999,999</td></tr></table><hr><div style="text-align:center">الورق ${r.p}mm · الهامش ${r.m}mm · الإزاحة ${r.o}mm · الخط ${r.f}pt</div></div></div><p class="hint np">${ic('info')}<span>إذا كان الإطار مقصوصاً من جهة واحدة عدّل «الإزاحة»، وإذا كان مقصوصاً من الجهتين زد «الهامش الجانبي» أو صغّر الخط.</span></p>`,`<button class="b4" onclick="doPrint('t80')">${ic('print')} طباعة على الطابعة الصغيرة</button><button class="b5" onclick="cl()">إغلاق</button>`)}
/* ===== الإعدادات والنسخ الاحتياطي ===== */
function pSet(){const r=RP();return hd('set')+`<div class="box"><h3>${ic('store')} اسم المحل (يظهر على الوصل)</h3><div class="bar" style="margin:0"><input id="f_s" style="flex:1;min-width:12rem;margin:0" value="${h(cf('shop')||'')}"><button onclick="sc('shop',g('s')).then(()=>{go();alert('تم الحفظ')})">${ic('save')} حفظ</button></div></div>
<div class="box"><h3>${ic('print')} طابعة الوصل الحرارية</h3><p class="hint">${ic('info')}<span>إذا ظهر الوصل مقصوصاً من الأطراف عدّل القيم ثم اضغط «حفظ وطباعة تجريبية». القيم الافتراضية مناسبة لأغلب طابعات 80mm.</span></p><div class="g2f">${fld('rw','عرض ورق الطابعة','select',r.p,[['80','80 مم (الأكثر شيوعاً)'],['58','58 مم (صغيرة)']])}${fld('rf','حجم خط الوصل (نقطة)','number',r.f)}</div><div class="g2f">${fld('rm','الهامش الجانبي (مم)','number',r.m)}${fld('ro','إزاحة أفقية (مم): موجب لليمين، سالب لليسار','number',r.o)}</div><div class="ft" style="margin:0"><button onclick="svRP()">${ic('save')} حفظ</button><button class="b4" onclick="svRP(1)">${ic('ruler')} حفظ وطباعة تجريبية</button><button class="b5" onclick="rsRP()">الإعدادات الافتراضية</button></div></div>
<div class="box"><h3>${ic('key')} تغيير كلمة المرور</h3>${fld('o','كلمة المرور الحالية','password')}<div class="g2f">${fld('w','كلمة المرور الجديدة (4 خانات على الأقل)','password')}${fld('c','تأكيد كلمة المرور الجديدة','password')}</div><button onclick="chPw()">${ic('save')} حفظ كلمة المرور الجديدة</button></div>
<div class="box"><h3>${ic('shield')} النسخ الاحتياطي</h3><p style="margin-bottom:.8rem">آخر نسخة احتياطية: <b>${cf('bk')||'لم تُنشأ بعد'}</b></p><div class="ft" style="margin:0"><button class="b2" onclick="bk()">${ic('down')} تنزيل نسخة احتياطية</button><label class="b b4" style="margin:0">${ic('upl')} استرجاع نسخة<input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label></div></div>`}
async function chPw(){const o=g('o'),n=g('w');if(hs(o)!=curPw()&&hs(nd(o))!=curPw())return alert('كلمة المرور الحالية غير صحيحة');if(n.length<4)return alert('كلمة المرور الجديدة قصيرة (4 خانات على الأقل)');if(n!=g('c'))return alert('التأكيد غير مطابق لكلمة المرور الجديدة');await sc('pw',hs(nd(n)));['o','w','c'].forEach(k=>$('#f_'+k).value='');alert('تم تغيير كلمة المرور. استخدم الجديدة عند الدخول القادم')}
async function bk(){const d={};ST.forEach(s=>d[s]=s=='cfg'?S[s].filter(x=>x.id!='pw'):S[s]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup-'+today()+'.json';a.click();await sc('bk',today());go();alert('تم تنزيل النسخة الاحتياطية')}
async function rs(f){if(!f)return;if(!await ask('سيتم استبدال جميع البيانات الحالية بالنسخة المختارة. متابعة؟','نعم، استرجع')){return}let d;try{d=JSON.parse(await f.text())}catch(e){return alert('الملف غير صالح')}for(const s of ST){for(const x of S[s])if(!(s=='cfg'&&x.id=='pw'))await del(s,x.id);for(const x of d[s]||[])if(!(s=='cfg'&&x.id=='pw'))await put(s,x)}await load();go();alert('تم الاسترجاع')}

const curPw=()=>cf('pw')||'167707210';

$('#lock').innerHTML=`<i class="lk-o a"></i><i class="lk-o b"></i><i class="lk-o c"></i>${Array.from({length:22},()=>`<span class="pt" style="--x:${(Math.random()*100).toFixed(1)}%;--s:${(2+Math.random()*5).toFixed(1)}px;--d:${(9+Math.random()*12).toFixed(1)}s;--dl:-${(Math.random()*18).toFixed(1)}s"></span>`).join('')}${WV()}<div class="lk-c"><div class="lk-l"><img src="${LOGO}" alt=""></div><h1>إدارة الدوام والرواتب</h1><p>${h(cf('shop')||'أهلاً بك')} — أدخل كلمة المرور للمتابعة</p><div class="pwf">${ic('key')}<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="eye" type="button" title="إظهار / إخفاء كلمة المرور" onclick="const p=$('#pw');p.type=p.type=='password'?'text':'password';p.focus()">${ic('eye')}</button></div><button class="lk-b" onclick="login()">دخول ${ic('arr')}</button><div class="lk-cr">تطوير وبرمجة Hamza Shakir · <span dir="ltr">07742242040</span></div></div>`;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#pw').focus()})();
